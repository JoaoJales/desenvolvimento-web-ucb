<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>   
    <title>Form Agendamento Bootstrap</title>
</head>
<body>
   <div class="container">
        <h1 class="text-center mt-4">Formulário de Agendamento</h1>
        <form class="mt-4" action="/agendamento" method="post">
             <!-- DADOS DO PACIENTE -->
            <h2 class="mb-3">Dados do Paciente</h2>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="nome" class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="sobrenome" class="form-label">Sobrenome</label>
                    <input type="text" class="form-control" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="cpf" class="form-label">CPF</label>
                    <input type="text" class="form-control" id="cpf" name="cpf" placeholder="Digite seu CPF" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="data_nascimento" class="form-label">Data de Nascimento</label>
                    <input type="date" class="form-control" id="data_nascimento" name="data_nascimento" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="Digite seu telefone" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="cep" class="form-label">CEP</label>
                    <input type="text" class="form-control" id="cep" name="cep" placeholder="Digite seu CEP" required>
                </div>

                <div class="col-12 mb-3">
                    <label for="endereco" class="form-label">Endereço</label>
                    <input type="text" class="form-control" id="endereco" name="endereco" placeholder="Digite seu endereço" required>
                </div>
            </div>


             <!-- DADOS DA CONSULTA -->
            <h2 class="mb-3 mt-4">Dados da Consulta</h2>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="clinica" class="form-label">Clínica</label>
                    <select type="text" class="form-select" id="clinica" name="clinica" required>
                        <option selected value="">Selecione uma clínica</option>
                        <option value="clinica1">Clínica 1</option>
                        <option value="clinica2">Clínica 2</option>
                        <option value="clinica3">Clínica 3</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="especialidade" class="form-label">Especialidade</label>
                    <select class="form-select" id="especialidade" name="especialidade" required>
                        <option selected value="">Selecione uma especialidade</option>
                        <option value="cardiologia">Cardiologia</option>
                        <option value="dermatologia">Dermatologia</option>
                        <option value="oftalmologia">Oftalmologia</option>
                        <option value="pediatria">Pediatria</option>
                        <option value="psiquiatria">Psiquiatria</option>
                        <option value="ortopedia">Ortopedia</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="data_agendamento" class="form-label">Data do Agendamento</label>
                    <input type="date" class="form-control" id="data_agendamento" name="data_agendamento" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="hora_agendamento" class="form-label">Hora do Agendamento</label>
                    <input type="time" class="form-control" id="hora_agendamento" name="hora_agendamento" required>
                </div>

                <div class="col-12 mb-3">
                    <label for="observacao" class="form-label">Observação</label>
                    <textarea class="form-control" id="observacao" name="observacao" rows="4" placeholder="Digite observações sobre a consulta"></textarea>
                </div>
            </div>
            
            <div class="row mt-4 mb-4">
                <div class="col-12">
                    <button type="submit" class="btn btn-primary w-100">Enviar</button>
                </div>
            </div>
        </form>
   </div>
</body>
</html>
